name: PDF retrieval acceptance
on:
  push:
    branches: [pdf-retrieval]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r competition/requirements.txt
      - name: PDF public acceptance
        env:
          PYTHONPATH: src:competition
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -s -c competition/pytest.ini --confcutdir=competition competition/challenges/source-03-pdf-retrieval/acceptance
